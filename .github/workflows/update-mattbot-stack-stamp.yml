name: Update KAIST mattbot stack stamp

# DISABLED: automatic last-commit stamps on mattbot/kaist.html are turned off.
# The workflow still accepts workflow_call / workflow_dispatch so callers in
# package repos do not fail, but it no longer edits or pushes the site.
#
# To re-enable, restore the previous job body from git history.
on:
  workflow_call:
    inputs:
      commit_iso:
        description: "ISO timestamp of the triggering commit (push events)"
        required: false
        type: string
        default: ""
      commit_sha:
        description: "SHA of the triggering commit"
        required: false
        type: string
        default: ""
      source_repo:
        description: "owner/name of the source package repo"
        required: false
        type: string
        default: ""
    secrets:
      SITE_REPO_TOKEN:
        required: false
  workflow_dispatch:

jobs:
  update-site:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Feature disabled
        run: |
          echo "KAIST mattbot stack stamp updates are disabled."
          echo "Skipping site checkout and kaist.html edit."
          echo "Trigger: ${{ github.event_name }} from ${{ inputs.source_repo || github.repository }}"
